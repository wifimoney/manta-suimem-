version: "3.8"

services:
  # ============================================================
  # Postgres + pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tide_recall
      POSTGRES_USER: tide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tide_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tide -d tide_recall"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Tide Indexer (TypeScript)
  # ============================================================
  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    environment:
      SUI_RPC_URL: ${SUI_RPC_URL:-https://fullnode.testnet.sui.io:443}
      TIDE_PACKAGE_ID: ${TIDE_PACKAGE_ID}
      DATABASE_URL: postgres://tide:${POSTGRES_PASSWORD:-tide_dev_password}@postgres:5432/tide_recall
      NETWORK: ${NETWORK:-testnet}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      MODULE_NAME: ${MODULE_NAME:-memory}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Phase 2+ services (uncomment when ready)
  # ============================================================

  # embedder:
  #   build: ./embedder
