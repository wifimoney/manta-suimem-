  #     MODEL_NAME: nomic-ai/nomic-embed-text-v1.5
  #     DEVICE: cpu
  #   ports:
  #     - "8081:8081"

  # api:
  #   build: ./api
  #   environment:
  #     DATABASE_URL: postgres://tide:${POSTGRES_PASSWORD:-tide_dev_password}@postgres:5432/tide_recall
  #     EMBEDDER_URL: http://embedder:8081
  #     SUI_RPC_URL: ${SUI_RPC_URL:-https://fullnode.testnet.sui.io:443}
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres
  #     - embedder

volumes:
  pgdata:
